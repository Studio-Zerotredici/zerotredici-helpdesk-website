version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: 'secret0013'
      POSTGRES_USER: 'dev'
      POSTGRES_DB: 'localdev'
    volumes:
      - ./postgres-data:/var/lib/postgres/data
    ports:
      - 5432:5432
    networks:
      - postgres-16
      
networks:
  postgres-16:
    external: true