services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-guddesk}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-guddesk}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gateway
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guddesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-guddesk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guddesk} -d ${POSTGRES_DB:-guddesk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed on the host — reachable only from the `app` service on the
    # internal network. Never publish 5432 publicly.

networks:
  gateway:
    external: true # reverse proxy network (Dokploy/Traefik)
  internal:

volumes:
  postgres-data:
